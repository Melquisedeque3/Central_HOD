<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOD — Home Office Digital</title>
<meta name="description" content="Central pessoal de candidaturas, processos, prazos e rotinas do Home Office Digital.">
<link rel="icon" type="image/png" href="icons/icon16.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div class="hq-grain" aria-hidden="true"></div>

<div class="app">
  <header class="hq-masthead">
    <div class="masthead-location">
      <nav class="hq-breadcrumb" aria-label="Navegação">
        <button class="home-wordmark" data-nav="home" aria-label="Ir para o início">
          <strong>HOD</strong><span>/ Home</span>
        </button>
      </nav>
    </div>

    <div class="masthead-center">
      <div class="clock" aria-label="Hora e data">
        <strong id="clock-time">00:00</strong>
        <span id="clock-date">Segunda, 09 de Novembro</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn-top-pill" data-action="new-app">
        <span>+ Candidatura</span>
      </button>
      <button class="btn-top-icon" data-nav="settings" title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>
      </button>
      <button class="btn-top-icon" data-nav="theme" title="Alternar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <div id="view-body"></div>
  </main>
</div>

<!-- ============ DOCK HORIZONTAL FLUTUANTE ============ -->
<nav class="control-dock" id="control-dock" aria-label="Navegação principal">
  <div class="dock-core" id="dock-core">
    <i class="dock-glide" id="dockGlide" aria-hidden="true"></i>

    <button class="dock-app" data-nav="all" title="Todos os módulos" aria-label="Todos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>

    <button class="dock-app is-active" data-nav="home" data-route="home" title="Início" aria-label="Início" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10.5 12 4l8 6.5V20h-5.2v-4.6h-5.6V20H4z"/></svg>
    </button>

    <button class="dock-app" data-nav="tasks" data-route="tasks" title="Tarefas" aria-label="Tarefas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="2" cy="6" r="1" fill="currentColor"/><circle cx="2" cy="12" r="1" fill="currentColor"/><circle cx="2" cy="18" r="1" fill="currentColor"/></svg>
    </button>

    <button class="dock-app has-badge" data-nav="apps" data-route="apps" title="Candidaturas & Processos" aria-label="Processos">
      <span class="dock-badge-num" id="dockBadgeApps">3</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m22 7-10 6L2 7"/></svg>
    </button>

    <button class="dock-app" data-nav="pipeline" data-route="pipeline" title="Pipeline Kanban" aria-label="Pipeline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </button>

    <button class="dock-app" data-nav="metrics" data-route="pipeline" title="Métricas & Desempenho" aria-label="Métricas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18M5 16l5-6 4 3 5-8"/></svg>
    </button>

    <button class="dock-app" data-nav="documents" data-route="study" title="Documentos & Guidelines" aria-label="Documentos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h10l6 6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M14 4v6h6"/></svg>
    </button>

    <button class="dock-app" data-nav="community" data-route="apps" title="Contatos & Empresas" aria-label="Contatos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>

    <button class="dock-app" data-nav="workflows" data-route="home" title="Automações & Rotina" aria-label="Automações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 18 6-6-6-6M15 18l6-6-6-6"/></svg>
    </button>

    <div class="dock-divider" aria-hidden="true"></div>

    <button class="dock-app dock-gemini" data-action="open-gemini" title="Gemini AI Multimodal" aria-label="Gemini">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07 19.07 4.93"/></svg>
    </button>
  </div>
</nav>

<div id="modal-root" hidden></div>
<div id="toast-host" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
