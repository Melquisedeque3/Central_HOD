<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOD — Home Office Digital</title>
<meta name="description" content="Central pessoal de candidaturas, processos, prazos e rotinas do Home Office Digital.">
<link rel="icon" type="image/png" href="icons/icon16.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div class="hq-grain" aria-hidden="true"></div>

<div class="app">
  <header class="hq-masthead">
    <div class="masthead-location">
      <nav class="hq-breadcrumb" aria-label="Navegação">
        <button class="home-wordmark" data-nav="home" aria-label="Ir para o início">
          <strong>HOD</strong>
        </button>
        <span class="crumb-sep" id="crumb-sep">/</span>
        <button class="crumb-page" id="crumb-parent" data-nav="apps" hidden>Processos</button>
        <span class="crumb-sep" id="crumb-sep-2" hidden>/</span>
        <strong class="crumb-current" id="crumb-current" aria-current="page">Home</strong>
      </nav>
    </div>

    <div class="masthead-center">
      <div class="clock" aria-label="Hora e data">
        <strong id="clock-time">00:00</strong>
        <span id="clock-date">Segunda, 09 de Novembro</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn-top-pill" data-action="new-app">
        <span>+ Candidatura</span>
      </button>
      <button class="btn-top-icon" data-nav="settings" title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>
      </button>
      <button class="btn-top-icon" data-nav="theme" title="Alternar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <header class="page-head" id="page-head">
      <p class="eyebrow" id="page-kicker"></p>
      <h1 id="page-title">Seu dia</h1>
      <p class="page-subtitle" id="page-subtitle" hidden></p>
    </header>
    <div id="view-body"></div>
  </main>
</div>

<!-- ============ DOCK HORIZONTAL FLUTUANTE ============ -->
<nav class="control-dock" id="control-dock" aria-label="Navegação principal">
  <div class="dock-core" id="dock-core">
    <i class="dock-glide" id="dockGlide" aria-hidden="true"></i>

    <!-- 1 - Home -->
    <button class="dock-app is-active" data-nav="home" data-route="home" title="1. Início" aria-label="Início" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10.5 12 4l8 6.5V20h-5.2v-4.6h-5.6V20H4z"/></svg>
    </button>

    <!-- 2 - Candidaturas -->
    <button class="dock-app has-badge" data-nav="apps" data-route="apps" title="2. Candidaturas (Kanban por Empresa)" aria-label="Candidaturas">
      <span class="dock-badge-num" id="dockBadgeApps">0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m22 7-10 6L2 7"/></svg>
    </button>

    <!-- 3 - Tarefas -->
    <button class="dock-app" data-nav="tasks" data-route="tasks" title="3. Tarefas (Kanban por Prioridade)" aria-label="Tarefas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="2" cy="6" r="1" fill="currentColor"/><circle cx="2" cy="12" r="1" fill="currentColor"/><circle cx="2" cy="18" r="1" fill="currentColor"/></svg>
    </button>

    <!-- 4 - Email -->
    <button class="dock-app" data-nav="email" data-route="email" title="4. Email (Por Empresa e Prioridade)" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
    </button>

    <!-- 5 - Aprendizagem -->
    <button class="dock-app" data-nav="study" data-route="study" title="5. Aprendizagem & Guidelines" aria-label="Aprendizagem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10M6 14h6"/></svg>
    </button>

    <!-- 6 - Rotina -->
    <button class="dock-app" data-nav="routine" data-route="routine" title="6. Rotina Diária Otimizada" aria-label="Rotina">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </button>

    <!-- 7 - Métricas e Desempenho -->
    <button class="dock-app" data-nav="metrics" data-route="metrics" title="7. Métricas & Desempenho" aria-label="Métricas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18M5 16l5-6 4 3 5-8"/></svg>
    </button>

    <!-- 8 - IA -->
    <button class="dock-app dock-gemini" data-nav="ai" data-route="ai" title="8. Central IA Multimodal" aria-label="IA">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07 19.07 4.93"/></svg>
    </button>

    <!-- 9 - Configurações -->
    <button class="dock-app" data-nav="settings" data-route="settings" title="9. Configurações & Central de APIs" aria-label="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</nav>

<div id="modal-root" hidden></div>
<div id="toast-host" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
